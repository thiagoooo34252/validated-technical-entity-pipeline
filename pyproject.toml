[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "validated-technical-entity-pipeline"
version = "0.1.0"
description = "Validated technical entity extraction with resilient LangChain structured output"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Thiago" }]
dependencies = [
  "langchain>=1.2,<2.0",
  "langchain-openai>=1.1,<2.0",
  "openai>=2.0,<3.0",
  "pydantic>=2.12,<3.0",
  "python-dotenv>=1.2,<2.0",
]

[dependency-groups]
dev = [
  "build>=1.3,<2.0",
  "pyright>=1.1.400,<2.0",
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.3,<2.0",
  "pytest-cov>=7.0,<8.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools]
py-modules = ["chain", "schemas"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "strict"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["chain", "schemas"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.pyright]
exclude = ["tests"]
include = ["chain.py", "demo.py", "schemas.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
